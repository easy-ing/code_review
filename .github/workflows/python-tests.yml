name: Python Tests

permissions:
  contents: read
  issues: write

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: [3.8, 3.9, 3.10, 3.11]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-${{ matrix.python-version }}-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest-cov

      - name: Run tests (with JUnit & coverage)
        run: |
          mkdir -p reports
          pytest -q --junitxml=reports/junit-${{ matrix.python-version }}.xml --cov=. --cov-report=xml:reports/coverage-${{ matrix.python-version }}.xml

      - name: Upload JUnit report
        uses: actions/upload-artifact@v4
        with:
          name: junit-${{ matrix.python-version }}
          path: reports/junit-${{ matrix.python-version }}.xml

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.python-version }}
          path: reports/coverage-${{ matrix.python-version }}.xml

  comment:
    name: Post PR test summary
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      issues: write
      contents: read
    steps:
      - name: Post PR test results summary (same-repo)
        if: github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v6
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const run_id = parseInt(process.env.GITHUB_RUN_ID)
            const owner = context.repo.owner
            const repo = context.repo.repo

            const run = await github.rest.actions.getWorkflowRun({ owner, repo, run_id })
            const jobs = await github.rest.actions.listJobsForWorkflowRun({ owner, repo, run_id })

            const total = jobs.data.jobs.length
            const failed = jobs.data.jobs.filter(j => j.conclusion !== 'success').length
            const overall = failed > 0 ? 'failed' : 'success'
            const passed = total - failed

            const body = `Automated test summary — Overall: ${overall} (${passed}/${total}) — Workflow: [${run.data.name}](${run.data.html_url})`

            if (context.payload.pull_request && context.payload.pull_request.number) {
              await github.rest.issues.createComment({ owner, repo, issue_number: context.payload.pull_request.number, body })
            } else {
              core.info('No pull_request context available; skipping comment.')
            }

      - name: Post PR test results summary (forked PR - use PAT)
        if: github.event.pull_request.head.repo.full_name != github.repository
        uses: actions/github-script@v6
        with:
          github-token: ${{ secrets.COMMENTER_PAT }}
          script: |
            const run_id = parseInt(process.env.GITHUB_RUN_ID)
            const owner = context.repo.owner
            const repo = context.repo.repo

            const run = await github.rest.actions.getWorkflowRun({ owner, repo, run_id })
            const jobs = await github.rest.actions.listJobsForWorkflowRun({ owner, repo, run_id })

            const total = jobs.data.jobs.length
            const failed = jobs.data.jobs.filter(j => j.conclusion !== 'success').length
            const overall = failed > 0 ? 'failed' : 'success'
            const passed = total - failed

            const body = `Automated test summary — Overall: ${overall} (${passed}/${total}) — Workflow: [${run.data.name}](${run.data.html_url})`

            if (context.payload.pull_request && context.payload.pull_request.number) {
              await github.rest.issues.createComment({ owner, repo, issue_number: context.payload.pull_request.number, body })
            } else {
              core.info('No pull_request context available; skipping comment.')
            }
